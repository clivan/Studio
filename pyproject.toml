[project]
name = "studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claudio Esparza", email = "claudio.ivan01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
studio = "studio:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
